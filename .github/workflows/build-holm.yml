# Builds the Holm installer on GitHub's Windows machines and publishes it on
# the repository's Releases page.
#
# Runs on every push to main that touches the app, and by hand from the Actions
# tab ("Run workflow"). No secrets are needed: Holm's installer is unsigned
# and its auto-updater is switched off (see `updater.rs`), so there is no
# signing key to provide.
#
# Upstream Crest's own release.yml was removed in this fork: it publishes to
# upstream's update feed with upstream's signing key, neither of which exists
# here.

name: Build Holm

on:
  push:
    branches: [main]
    paths:
      - 'product/**'
      - '.github/workflows/build-holm.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-holm
  cancel-in-progress: false

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: product/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Read version
        id: meta
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Holm-${{ steps.meta.outputs.version }}-installer
          path: product/src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-build.${{ github.run_number }}
          name: Holm ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          body: |
            Download `Holm_${{ steps.meta.outputs.version }}_x64-setup.exe` below and run it.
            Windows may warn that the app is unrecognised — click **More info → Run anyway**.
          files: product/src-tauri/target/release/bundle/nsis/*.exe
